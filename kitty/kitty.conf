font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size 35

# Colores
foreground #abb2bf
background #1C1C1C

# Colores normales
color0 #5c6370
color1 #e06c75
color2 #98c379
color3 #e5c07b
color4 #61afef
color5 #c678dd
color6 #56b6c2
color7 #828997

# Colores brillantes (normalmente los mismos que normales en este caso)
color8 #5c6370
color9 #e06c75
color10 #98c379
color11 #e5c07b
color12 #61afef
color13 #c678dd
color14 #56b6c2
color15 #828997

# Cursor
cursor #528bff
cursor_text_color background

# Selección
selection_foreground #abb2bf
selection_background #3e4451

# Ventana
background_opacity 1.0
window_padding_width 0

# Mapeado de teclas para emular los atajos de Alacritty con Command
# En Kitty, usamos kitty_mod (que normalmente es ctrl+shift) o directamente cmd
# Kitty usa una sintaxis diferente para los atajos de teclado

map cmd+a send_text all \x01
map cmd+b send_text all \x02
map cmd+c send_text all \x03
map cmd+d send_text all \x04
map cmd+e send_text all \x05
map cmd+f send_text all \x06
map cmd+g send_text all \x07
map cmd+h send_text all \x08
map cmd+i send_text all \x09
map cmd+j send_text all \x0A
map cmd+k send_text all \x0B
map cmd+l send_text all \x0C
map cmd+m send_text all \x0D
map cmd+n send_text all \x0E
map cmd+o send_text all \x0F
map cmd+p send_text all \x10
map cmd+r send_text all \x12
map cmd+s send_text all \x13
map cmd+t send_text all \x14
map cmd+u send_text all \x15
map cmd+w send_text all \x17
map cmd+x send_text all \x18
map cmd+y send_text all \x19
map cmd+z send_text all \x1A

map cmd+enter null

confirm_os_window_close 0
